name: Docs

env:
  # Current supported uv version. The uv documentation recommends pinning
  # this. The version should match the version used in .pre-commit-config.yaml
  # and frozen in uv.lock.
  UV_VERSION: "0.13.4"

"on":
  push:
    branches:
      - "main"
      - "tickets/**"
    paths:
      - "docs/**"
      - "src/**.py"
      - "CHANGELOG.md"
  release:
    types: [published]

jobs:
  docs:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    env:
      HAS_OOK_TOKEN: ${{ secrets.OOK_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install graphviz

      - name: Run tox
        run: uv run --only-group=tox tox run -e docs
        env:
          OOK_TOKEN: ${{ secrets.OOK_TOKEN }}

      - name: Check links
        if: env.HAS_OOK_TOKEN == 'true'
        run: uv run --only-group=tox tox run -e docs-linkcheck
        env:
          OOK_TOKEN: ${{ secrets.OOK_TOKEN }}

      # Upload to Docverse. Fork and dependabot pull requests can't read the
      # DOCVERSE_TOKEN secret, which is why the condition below excludes them.
      - name: Upload to Docverse
        uses: lsst-sqre/docverse-upload@v1
        with:
          org: rubin
          project: "noteburst"
          dir: "docs/_build/html"
          token: ${{ secrets.DOCVERSE_TOKEN }}
          github-token: ${{ github.token }}
          comment-on-pr: "true"
